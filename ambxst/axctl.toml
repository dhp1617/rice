[target]
hyprland = "hyprland.lua"

[startup]
exec-once = "ambxst"

[appearance]
[appearance.gaps]
inner = 2
outer = 4

[appearance.border]
width = 2
active_color = "rgb(7d7871)"
inactive_color = "rgb(292727)"
rounding = 16

[appearance.opacity]
active = 1.0
inactive = 1.0

[appearance.blur]
enabled = true
size = 4
passes = 2

[appearance.shadow]
enabled = true
size = 8
color = "rgba(00000080)"

[appearance.animations]
enabled = true
workspace_style = "slidefade 20%"

[general]
layout = "dwindle"

[layer_rules]

[[layer_rules]]
namespace = "quickshell"
no_anim = true

[[layer_rules]]
namespace = "quickshell"
blur = true

[[layer_rules]]
namespace = "^ambxst(:.*)?$"
blur = true
blur_popups = true
no_anim = true
ignore_alpha_value = 0.20

[input]
[input.keyboard]
layouts = ""
variants = ""
