# ═══ Kitty — Ryoku Dark Cyan Rice ═══

# --- Font (matches Ambxst monoFont) ---
font_family      Iosevka Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
font_features    IosevkaNFM+ss01 IosevkaNFM+ss02 IosevkaNFM+calt IosevkaNFM+liga
adjust_line_height 110%

# --- Window ---
window_padding_width 14
window_margin_width  0
hide_window_decorations yes
confirm_os_window_close 0
background_opacity   0.55
dynamic_background_opacity yes
scrollback_lines     10000
enable_audio_bell    no
shell_integration    enabled

# --- Cursor (trail + shape) ---
cursor                #72d8ff
cursor_text_color     #080c0e
cursor_shape          block
cursor_beam_thickness 1.5
cursor_trail          3
cursor_trail_decay    0.1 0.4
cursor_trail_start_threshold 2

# --- Tabs ---
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}"
active_tab_font_style   bold
inactive_tab_font_style normal
tab_activity_symbol   " ●"

# --- Colors (Ryoku Dark Cyan) ---
foreground            #dcebed
background            #080c0e
selection_foreground  #080c0e
selection_background  #72d8ff
url_color             #72d8ff
active_border_color   #72d8ff
inactive_border_color #26383d

# Normal
color0  #10171a
color1  #e06c75
color2  #7ee0a9
color3  #e5c07b
color4  #72d8ff
color5  #c678dd
color6  #56b6c2
color7  #dcebed

# Bright
color8  #4d5c60
color9  #e06c75
color10 #7ee0a9
color11 #e5c07b
color12 #72d8ff
color13 #c678dd
color14 #56b6c2
color15 #ffffff

# --- Misc ---
allow_remote_control yes

# Uncomment below if you want wallust to recolor kitty on wallpaper change:
#include ~/.cache/wal/colors-kitty.conf

# --- Keybinds (don't clash with Hyprland SUPER binds) ---
map ctrl+shift+enter  new_window_with_cwd
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+left   previous_tab
map ctrl+shift+right  next_tab
map ctrl+shift+q      close_window
map ctrl+shift+f      toggle_layout stack
map ctrl+shift+z      toggle_layout tall
map ctrl+shift+h      scroll_line_up
map ctrl+shift+l      scroll_line_down
map ctrl+shift+equal  change_font_size all +1.0
map ctrl+shift+minus  change_font_size all -1.0
map ctrl+shift+0      change_font_size all 0


include ~/.cache/ambxst/kitty.conf
